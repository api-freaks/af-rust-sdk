[package]
name = "apifreaks"
version = "1.1.1"
edition = "2024"
description = "Rust SDK for APIFreaks"
license = "MIT"
repository = "https://github.com/api-freaks/af-rust-sdk"
documentation = "https://docs.rs/apifreaks"

[lib]
doctest = false

[dependencies]
base64 = "0.22"
bytes = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["multipart"]
multipart = ["reqwest/multipart"]
